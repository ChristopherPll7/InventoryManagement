services:
  api:
    image: ${INVENTORY_API_IMAGE:-inventorymanagement-api:local}
    build:
      context: .
      dockerfile: src/InventoryManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Server=sqlserver,1433;Database=InventoryManagement;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      Authentication__Authority: ${JWT_AUTHORITY}
      Authentication__Audience: ${JWT_AUDIENCE}
      Authentication__SwaggerClientId: ${SWAGGER_CLIENT_ID:-inventory-swagger}
      Authentication__RequireHttpsMetadata: "false"
    ports:
      - "8080:8080"
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
    networks:
      - inventory-network

  schema-migrate:
    image: ${INVENTORY_API_IMAGE:-inventorymanagement-api:local}
    build:
      context: .
      dockerfile: src/InventoryManagement.Api/Dockerfile
    command: ["--migrate"]
    environment:
      ConnectionStrings__InventoryDatabase: Server=sqlserver,1433;Database=InventoryManagement;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - inventory-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - inventory-network

  database-init:
    image: mcr.microsoft.com/mssql-tools
    environment:
      SQL_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools/bin/sqlcmd \
          -S sqlserver,1433 \
          -U sa \
          -P "$$SQL_PASSWORD" \
          -C \
          -b \
          -i /scripts/001-create-database.sql
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - inventory-network

  keycloak-init:
    image: python:3.13-alpine
    command: ["python", "-B", "/scripts/bootstrap-user.py"]
    environment:
      KEYCLOAK_URL: http://keycloak:8081
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      INVENTORY_DEV_USERNAME: ${INVENTORY_DEV_USERNAME:-adminInventory}
      INVENTORY_DEV_PASSWORD: ${INVENTORY_DEV_PASSWORD:?Set INVENTORY_DEV_PASSWORD in .env}
    volumes:
      - ./keycloak/bootstrap-user.py:/scripts/bootstrap-user.py:ro
      - ./keycloak/inventory-management-realm.json:/config/realm.json:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"
    networks:
      - inventory-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://keycloak.localhost:8081
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/inventory-management-realm.json:/opt/keycloak/data/import/inventory-management-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      inventory-network:
        aliases:
          - keycloak.localhost

volumes:
  sqlserver-data:
  keycloak-data:

networks:
  inventory-network:
    driver: bridge
